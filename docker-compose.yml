version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mental_health_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_dev_password
      POSTGRES_DB: mental_health_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: mental_health_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: